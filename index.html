<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三小学学生成绩核算系统by冬阳 v1.45</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--bg:#f0f4f8;--card-bg:#fff;--text:#1e293b;--text-sec:#64748b;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 10px 25px rgba(0,0,0,.1);--radius:8px;--radius-lg:12px;--gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.header{background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 50%,#1e40af 100%);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(37,99,235,.2);position:sticky;top:0;z-index:100;transition:box-shadow .3s}
.header-left{display:flex;align-items:center;gap:12px}
.header-left .logo{width:40px;height:40px;border-radius:8px;object-fit:contain;background:#fff;padding:3px;transition:transform .3s;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header-left .logo:hover{transform:scale(1.1) rotate(5deg)}
.header-left h1{font-size:17px;font-weight:600;letter-spacing:.5px}
.header-left .ver{font-size:11px;background:rgba(255,255,255,.25);padding:2px 10px;border-radius:12px;margin-left:8px;transition:background .2s;backdrop-filter:blur(4px)}
.header-left .ver:hover{background:rgba(255,255,255,.4)}
.container{max-width:1400px;margin:0 auto;padding:20px}
.card{background:var(--card-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid var(--border);transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:var(--shadow-md)}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-title::before{content:'';display:inline-block;width:4px;height:16px;background:var(--primary);border-radius:2px}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:30px 16px;text-align:center;cursor:pointer;transition:all .3s;background:var(--bg)}
.upload-area:hover,.upload-area.dragover{border-color:var(--primary);background:var(--primary-light);transform:translateY(-2px)}
.upload-area .upload-icon{font-size:40px;margin-bottom:8px;transition:transform .3s}
.upload-area:hover .upload-icon{transform:scale(1.12)}
.upload-area p{color:var(--text-sec);font-size:13px}
.upload-area .hl{color:var(--primary);font-weight:600}
.file-info{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--primary-light);border-radius:var(--radius);margin-top:10px;transition:background .2s}
.file-info:hover{background:#c7dbfc}
.file-info .fn{font-weight:500;font-size:13px}
.file-info .fs{font-size:11px;color:var(--text-sec)}
.file-info .rm{margin-left:auto;background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:2px;transition:transform .2s}
.file-info .rm:hover{transform:scale(1.2)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input[type="number"],input[type="text"]{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:#fff;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
select:focus,input[type="number"]:focus,input[type="text"]:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{padding:7px 18px;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:5px;outline:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.25)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(37,99,235,.35)}
.btn-success{background:linear-gradient(135deg,var(--success),#15803d);color:#fff;box-shadow:0 2px 6px rgba(22,163,74,.25)}.btn-success:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(22,163,74,.35)}
.btn-warning{background:linear-gradient(135deg,var(--warning),#b45309);color:#fff;box-shadow:0 2px 6px rgba(217,119,6,.25)}.btn-warning:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(217,119,6,.35)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#b91c1c);color:#fff;box-shadow:0 2px 6px rgba(220,38,38,.25)}.btn-danger:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(220,38,38,.35)}
.btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}.btn-outline:hover{background:var(--primary-light);transform:translateY(-1px)}
.btn-sm{padding:3px 10px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--border);margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:8px 16px;border:none;background:none;font-size:13px;font-weight:500;color:var(--text-sec);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tab:hover{color:var(--primary)}.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 8px;text-align:center;border:1px solid var(--border)}
th{background:#f8fafc;font-weight:600;position:sticky;top:0;z-index:1;font-size:11px}
th.ga{background:#fef3c7}th.gb{background:#dbeafe}th.gt{background:#dcfce7}
td.r1{background:#fef9c3;font-weight:700;color:#92400e}td.r2{background:#f1f5f9;font-weight:600}td.r3{background:#fef2f2;font-weight:600}
tr.grade-total td{background:#e0f2fe;font-weight:700;border-top:2px solid var(--primary)}
tr:hover td{background:#f0f7ff}
tr.grade-total:hover td{background:#bae6fd}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stat-card{background:linear-gradient(135deg,#fff 0%,var(--bg) 100%);border-radius:var(--radius);padding:12px;text-align:center;border:1px solid var(--border);transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--primary-dark))}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.stat-card .sv{font-size:22px;font-weight:700;color:var(--primary)}
.stat-card .sl{font-size:11px;color:var(--text-sec);margin-top:4px}
.hidden{display:none!important}
.toast{position:fixed;top:70px;right:16px;padding:10px 16px;border-radius:var(--radius);color:#fff;font-size:13px;z-index:1000;animation:slideIn .3s ease;box-shadow:var(--shadow-lg);max-width:360px}
.toast-ok{background:var(--success)}.toast-err{background:var(--danger)}.toast-info{background:var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:var(--radius-lg);padding:20px;max-width:780px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal h3{margin-bottom:12px;font-size:15px}.modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.loading{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px;align-items:start}
.cfg-sec{margin-bottom:0;padding:8px 10px;background:#f8fafc;border-radius:var(--radius);border:1px solid var(--border)}
.cfg-sec-full{grid-column:1/-1}
.cfg-sec h4{font-size:12px;color:var(--text-sec);margin-bottom:6px;font-weight:600}
.cfg-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:4px}
.cfg-row:last-child{margin-bottom:0}
.cfg-row label{font-size:11px;min-width:42px;color:var(--text-sec)}
.cfg-row input{width:60px;padding:3px 6px;font-size:12px}
.cfg-unit{font-size:11px;color:var(--text-sec);margin-left:2px}
.footer{text-align:center;padding:18px;color:var(--text-sec);font-size:11px;border-top:1px solid var(--border);margin-top:20px;background:var(--card-bg)}
.cache-bar{background:#fef3c7;padding:6px 14px;border-radius:var(--radius);margin-bottom:10px;font-size:12px;display:flex;align-items:center;gap:6px}
.cache-bar .cb-btn{margin-left:auto;cursor:pointer;background:none;border:none;color:var(--primary);font-size:12px;text-decoration:underline}
/* v1.42: 参数确认按钮动画 */
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(220,38,38,0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.col-cfg-wrap{display:inline-block;max-height:400px;overflow-y:auto}
.col-cfg-tbl{border-collapse:collapse;font-size:11px;width:auto}
.col-cfg-tbl th,.col-cfg-tbl td{padding:2px 4px;border:1px solid var(--border);text-align:center;white-space:nowrap;font-size:11px}
.col-cfg-tbl th{background:#f8fafc;padding:2px 6px}
.col-cfg-tbl input[type="text"]{width:auto;min-width:36px;max-width:80px;padding:1px 3px;font-size:11px;border:1px solid #ddd;border-radius:3px}
.col-cfg-tbl input[type="checkbox"]{width:13px;height:13px;cursor:pointer}
.col-cfg-tbl tr[draggable="true"]{cursor:grab}
.col-cfg-tbl tr[draggable="true"]:active{cursor:grabbing}
.col-cfg-tbl tr.drag-over{border-top:3px solid var(--primary)!important}
.col-cfg-tbl tr.dragging{opacity:.4}
.col-cfg-tbl tr.locked-col{background:#fefce8;cursor:default}
/* v1.43: 卡片折叠动画 */
.card-body-collapse{overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1),opacity .3s ease,padding .3s ease,margin .3s ease;max-height:6000px}
.card.collapsed .card-body-collapse{max-height:0!important;opacity:0;padding-top:0!important;padding-bottom:0!important;margin-bottom:0!important;overflow:hidden}
.card.collapsed .card-title{margin-bottom:0}
.card-title[onclick]{cursor:pointer;user-select:none}
.card-title-toggle{margin-left:auto;background:rgba(37,99,235,.08);border:1px solid var(--border);color:var(--text-sec);font-size:11px;padding:2px 10px;border-radius:12px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:3px;font-weight:500}
.card-title-toggle:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}
.card-title-toggle .toggle-icon{display:inline-block;transition:transform .35s ease;font-size:10px}
.card.collapsed .card-title-toggle .toggle-icon{transform:rotate(-90deg)}
/* v1.43: 导出按钮高亮动画 */
@keyframes exportPulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.5),0 4px 12px rgba(22,163,74,.35);transform:scale(1.05)}50%{box-shadow:0 0 0 14px rgba(22,163,74,0),0 6px 20px rgba(22,163,74,.5);transform:scale(1.08)}}
.btn-export-highlight{animation:exportPulse 1.8s ease-in-out infinite;background:linear-gradient(135deg,#16a34a,#15803d,#16a34a)!important;background-size:200% auto!important;position:relative;z-index:1}
/* v1.43: 下载模板按钮高亮动画（橙色鲜艳） */
@keyframes templatePulse{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.5),0 4px 12px rgba(249,115,22,.35);transform:scale(1.05)}50%{box-shadow:0 0 0 12px rgba(249,115,22,0),0 6px 20px rgba(249,115,22,.5);transform:scale(1.08)}}
.btn-template-highlight{animation:templatePulse 1.8s ease-in-out infinite;background:linear-gradient(135deg,#f97316,#ea580c,#f97316)!important;background-size:200% auto!important;color:#fff!important;border-color:#ea580c!important;position:relative;z-index:1}
/* v1.43: 获奖教师展示区 */
.award-section{margin-top:16px;border:1px solid #fde68a;border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 2px 8px rgba(217,119,6,.1);animation:awardFadeIn .5s ease}
@keyframes awardFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.award-section-title{background:linear-gradient(135deg,#fef3c7,#fde68a);padding:10px 16px;font-size:14px;font-weight:700;color:#92400e;display:flex;align-items:center;gap:6px;border-bottom:1px solid #fde68a}
.award-section-title .award-count{margin-left:auto;font-size:11px;background:rgba(146,64,14,.15);padding:2px 10px;border-radius:10px;font-weight:600;white-space:nowrap}
.award-table-wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:380px}
.award-table{width:100%;border-collapse:collapse;font-size:12px;min-width:500px}
.award-table th{background:#fffbeb;padding:7px 10px;border:1px solid #fde68a;text-align:center;font-weight:600;font-size:12px;position:sticky;top:0;z-index:1}
.award-table td{padding:6px 10px;border:1px solid #fde68a;text-align:center;font-size:12px}
.award-table td.grade-name{background:#fef3c7;font-weight:700;color:#92400e;position:sticky;left:0;z-index:1;min-width:70px}
.award-table td.teacher-cell{color:var(--text);font-weight:500}
.award-table tr:hover td{background:#fef9c3}
.award-table tr:hover td.grade-name{background:#fde68a}
.award-summary{padding:10px 16px;background:#fffbeb;border-top:1px solid #fde68a;font-size:12px;color:#78350f;line-height:1.8}
.award-summary .teacher-tag{display:inline-block;background:#fff;padding:3px 10px;border:1px solid #fde68a;border-radius:12px;margin:2px 4px;font-size:11px;color:#92400e;font-weight:500;transition:all .2s}
.award-summary .teacher-tag:hover{background:#fef3c7;transform:translateY(-1px);box-shadow:0 2px 6px rgba(217,119,6,.2)}
/* v1.43: 步骤序号徽章 */
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(37,99,235,.35);flex-shrink:0;letter-spacing:0;font-family:inherit}
.step-badge.done{background:linear-gradient(135deg,#16a34a,#15803d);box-shadow:0 2px 8px rgba(22,163,74,.35)}
/* v1.43: 当前步骤脉冲提示动画 */
@keyframes stepPulse{0%,100%{transform:scale(1);box-shadow:0 2px 8px rgba(37,99,235,.35),0 0 0 0 rgba(37,99,235,.5)}50%{transform:scale(1.18);box-shadow:0 4px 14px rgba(37,99,235,.45),0 0 0 10px rgba(37,99,235,0)}}
.step-badge.step-active{animation:stepPulse 1.6s ease-in-out infinite;z-index:2}
@keyframes btnStepPulse{0%,100%{box-shadow:0 2px 6px rgba(37,99,235,.25),0 0 0 0 rgba(37,99,235,.4);transform:translateY(0)}50%{box-shadow:0 4px 14px rgba(37,99,235,.4),0 0 0 10px rgba(37,99,235,0);transform:translateY(-1px)}}
.btn.step-active{animation:btnStepPulse 1.6s ease-in-out infinite}
/* v1.43: 折叠按钮持续闪烁提示 */
@keyframes toggleHint{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.35);background:rgba(37,99,235,.08)}50%{box-shadow:0 0 0 5px rgba(37,99,235,0);background:rgba(37,99,235,.15)}}
.card-title-toggle{animation:toggleHint 2.2s ease-in-out infinite}
/* v1.43: 不同卡片折叠按钮采用不同鲜艳颜色 */
@keyframes toggleHintOrange{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.4);background:rgba(249,115,22,.12)}50%{box-shadow:0 0 0 6px rgba(249,115,22,0);background:rgba(249,115,22,.22)}}
@keyframes toggleHintPurple{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.4);background:rgba(139,92,246,.12)}50%{box-shadow:0 0 0 6px rgba(139,92,246,0);background:rgba(139,92,246,.22)}}
#uploadCard .card-title-toggle{animation:toggleHintOrange 2.2s ease-in-out infinite;border-color:#fb923c;color:#c2410c}
#uploadCard .card-title-toggle:hover{background:rgba(249,115,22,.25);color:#9a3412;border-color:#f97316}
#configCard .card-title-toggle{animation:toggleHintPurple 2.2s ease-in-out infinite;border-color:#a78bfa;color:#6d28d9}
#configCard .card-title-toggle:hover{background:rgba(139,92,246,.25);color:#5b21b6;border-color:#8b5cf6}
/* v1.43: 获奖学生展示区（绿色主题） */
.award-section.student-section{border-color:#bbf7d0;box-shadow:0 2px 8px rgba(34,197,94,.1)}
.award-section.student-section .award-section-title{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534;border-bottom-color:#bbf7d0}
.award-section.student-section .award-table th{background:#f0fdf4;border-color:#bbf7d0}
.award-section.student-section .award-table td{border-color:#bbf7d0}
.award-section.student-section .award-table td.grade-name{background:#dcfce7;color:#166534}
.award-section.student-section .award-table tr:hover td{background:#dcfce7}
.award-section.student-section .award-table tr:hover td.grade-name{background:#bbf7d0}
.award-section.student-section .award-summary{background:#f0fdf4;border-top-color:#bbf7d0;color:#14532d}
.award-section.student-section .award-summary .teacher-tag{border-color:#bbf7d0;background:#fff;color:#166534}
.award-section.student-section .award-summary .teacher-tag:hover{background:#dcfce7;box-shadow:0 2px 6px rgba(34,197,94,.2)}
/* v1.45: 获奖学生4列布局（与Excel导出格式一致） */
.award-student-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px;background:#f0fdf4}
.award-student-col{background:#fff;border:1px solid #bbf7d0;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(34,197,94,.08);transition:box-shadow .25s,transform .25s}
.award-student-col:hover{box-shadow:0 4px 12px rgba(34,197,94,.18);transform:translateY(-2px)}
.award-student-col-header{display:grid;grid-template-columns:1fr 1.4fr .8fr;background:linear-gradient(135deg,#dcfce7,#bbf7d0);padding:7px 8px;font-size:12px;font-weight:700;color:#166534;border-bottom:2px solid #86efac;letter-spacing:.5px}
.award-student-col-header span{text-align:center}
.award-student-col-body{display:flex;flex-direction:column}
.award-student-row{display:grid;grid-template-columns:1fr 1.4fr .8fr;padding:5px 8px;border-bottom:1px solid #f0fdf4;font-size:12px;transition:background .15s,transform .15s;align-items:center}
.award-student-row:nth-child(even){background:#f7fef9}
.award-student-row:hover{background:#dcfce7;transform:translateX(2px)}
.award-student-row:last-child{border-bottom:none}
.award-student-row .asc-cls{text-align:center;color:#166534;font-weight:600}
.award-student-row .asc-name{text-align:center;color:var(--text);font-weight:500}
.award-student-row .asc-total{text-align:center;font-weight:700;color:#15803d;font-size:13px}
.award-student-empty{padding:30px 10px;text-align:center;color:var(--text-sec);font-size:12px}
@media(max-width:900px){.award-student-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.award-student-grid{grid-template-columns:1fr}}
@media(max-width:768px){.header{padding:10px 14px}.header-left h1{font-size:13px}.container{padding:10px}.card{padding:12px}.controls{flex-direction:column;align-items:stretch}.stats-grid{grid-template-columns:repeat(2,1fr)}.btn{padding:6px 12px;font-size:12px}table{font-size:11px}th,td{padding:4px 5px}}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <img class="logo" src="logo_.ico" alt="校徽" onerror="this.style.display='none'">
    <h1>第三小学学生成绩核算系统by冬阳<span class="ver">v1.45</span></h1>
  </div>
  <button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.5);font-size:12px" onclick="showHelp()">使用说明</button>
</div>
<div class="container">
  <div id="cacheBar" class="cache-bar hidden">
    <span>💾 检测到上次缓存数据</span>
    <button class="cb-btn" onclick="loadCache()">点击恢复</button>
    <button class="cb-btn" onclick="clearCache()" style="color:var(--danger)">清除缓存</button>
  </div>
  <div class="card" id="uploadCard">

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三小学学生成绩核算系统by冬阳 v1.30</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--bg:#f0f4f8;--card-bg:#fff;--text:#1e293b;--text-sec:#64748b;--border:#e2e8f0;--radius:6px;--radius-lg:10px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#e8edf5 0%,#f0f4f8 40%,#f8fafc 100%);color:var(--text);line-height:1.4;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1e40af 0%,var(--primary) 40%,#3b82f6 100%);color:#fff;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:100;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:8px}
.header-left .logo{width:30px;height:30px;border-radius:5px;object-fit:contain;background:rgba(255,255,255,.95);padding:2px}
.header-left h1{font-size:15px;font-weight:600}
.header-left .ver{font-size:10px;background:rgba(255,255,255,.2);padding:1px 7px;border-radius:9px;margin-left:5px}
.container{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 10px;max-width:100%}
.container::-webkit-scrollbar{width:6px}
.container::-webkit-scrollbar-thumb{background:#c1c9d6;border-radius:3px}
.card{background:var(--card-bg);border-radius:var(--radius-lg);box-shadow:0 1px 2px rgba(0,0,0,.06);padding:10px 14px;margin-bottom:8px;border:1px solid var(--border)}
.card-title{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:20px 14px;text-align:center;cursor:pointer;transition:all .25s;background:var(--bg)}
.upload-area:hover,.upload-area.dragover{border-color:var(--primary);background:var(--primary-light);transform:translateY(-1px)}
.upload-area .upload-icon{font-size:32px;margin-bottom:4px}
.upload-area p{color:var(--text-sec);font-size:12px}
.upload-area .hl{color:var(--primary);font-weight:600}
.file-info{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--primary-light);border-radius:var(--radius);margin-top:8px}
.file-info .fn{font-weight:500;font-size:12px}
.file-info .fs{font-size:10px;color:var(--text-sec)}
.file-info .rm{margin-left:auto;background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:2px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
select,input[type=number],input[type=text]{padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;background:#fff;color:var(--text);outline:none;transition:border-color .2s}
select:focus,input[type=number]:focus,input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.btn{padding:5px 14px;border:none;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 3px 6px rgba(0,0,0,.08)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.9;transform:translateY(-1px)}
.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{opacity:.9}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.9}
.btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}.btn-outline:hover{background:var(--primary-light)}
.btn-sm{padding:3px 8px;font-size:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:10px;overflow-x:auto;flex-shrink:0}
.tab{padding:6px 14px;border:none;background:none;font-size:12px;font-weight:500;color:var(--text-sec);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tab:hover{color:var(--primary)}.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.table-wrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--border);flex:1;min-height:0}
.table-wrap::-webkit-scrollbar{width:5px;height:5px}
.table-wrap::-webkit-scrollbar-thumb{background:#c1c9d6;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:3px 5px;text-align:center;border:1px solid var(--border);white-space:nowrap}
th{background:#f8fafc;font-weight:600;position:sticky;top:0;z-index:2;font-size:10px}
th.ga{background:#fef3c7}th.gb{background:#dbeafe}th.gt{background:#dcfce7}
td.r1{background:#fef9c3;font-weight:700;color:#92400e}td.r2{background:#f1f5f9;font-weight:600}td.r3{background:#fef2f2;font-weight:600}
tr.grade-total td{background:#e0f2fe;font-weight:700;border-top:2px solid var(--primary)}
tr:hover td{background:#f0f7ff}
tr.grade-total:hover td{background:#bae6fd}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:8px}
.stat-card{background:linear-gradient(135deg,#f8fafc,#fff);border-radius:var(--radius);padding:8px 6px;text-align:center;border:1px solid var(--border);transition:transform .2s}
.stat-card:hover{transform:translateY(-1px);box-shadow:0 3px 6px rgba(0,0,0,.08)}
.stat-card .sv{font-size:18px;font-weight:700;color:var(--primary)}
.stat-card .sl{font-size:10px;color:var(--text-sec);margin-top:2px}
.hidden{display:none!important}
.toast{position:fixed;top:60px;right:12px;padding:8px 14px;border-radius:var(--radius);color:#fff;font-size:12px;z-index:1000;animation:slideIn .3s ease;box-shadow:0 8px 16px rgba(0,0,0,.1);max-width:340px}
.toast-ok{background:var(--success)}.toast-err{background:var(--danger)}.toast-info{background:var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:var(--radius-lg);padding:16px;max-width:760px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 16px rgba(0,0,0,.1)}
.modal h3{margin-bottom:10px;font-size:14px}.modal .btn-row{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.loading{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cfg-sec{margin-bottom:8px}.cfg-sec h4{font-size:12px;color:var(--text-sec);margin-bottom:4px}
.cfg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cfg-row label{font-size:11px;min-width:60px}.cfg-row input{width:60px}
.footer{text-align:center;padding:4px;color:var(--text-sec);font-size:10px;flex-shrink:0;background:#f8fafc;border-top:1px solid var(--border)}
.cache-bar{background:#fef3c7;padding:4px 10px;border-radius:var(--radius);margin-bottom:6px;font-size:11px;display:flex;align-items:center;gap:5px}
.cache-bar .cb-btn{margin-left:auto;cursor:pointer;background:none;border:none;color:var(--primary);font-size:11px;text-decoration:underline}
.col-cfg-wrap{display:inline-block;max-height:380px;overflow-y:auto}
.col-cfg-tbl{border-collapse:collapse;font-size:10px;width:auto}
.col-cfg-tbl th,.col-cfg-tbl td{padding:2px 3px;border:1px solid var(--border);text-align:center;white-space:nowrap;font-size:10px}
.col-cfg-tbl th{background:#f8fafc;padding:2px 5px}
.col-cfg-tbl input[type=text]{width:auto;min-width:32px;max-width:70px;padding:1px 2px;font-size:10px;border:1px solid #ddd;border-radius:3px}
.col-cfg-tbl input[type=checkbox]{width:12px;height:12px;cursor:pointer}
.col-cfg-tbl tr[draggable=true]{cursor:grab}
.col-cfg-tbl tr[draggable=true]:active{cursor:grabbing}
.col-cfg-tbl tr.drag-over{border-top:3px solid var(--primary)!important}
.col-cfg-tbl tr.dragging{opacity:.4}
.col-cfg-tbl tr.locked-col{background:#fefce8;cursor:default}
@media(max-width:768px){.header{padding:5px 10px}.header-left h1{font-size:12px}.container{padding:4px 6px}.card{padding:8px 10px}.controls{flex-direction:column;align-items:stretch}.stats-grid{grid-template-columns:repeat(2,1fr)}.btn{padding:4px 10px;font-size:11px}table{font-size:10px}th,td{padding:2px 3px}}
@media(min-width:1600px){.container{padding:6px 16px}.card{padding:12px 18px}table{font-size:12px}th{font-size:11px}th,td{padding:4px 6px}.stats-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <img class="logo" src="校徽2_.ico" alt="校徽" onerror="this.style.display='none'">
    <h1>第三小学学生成绩核算系统by冬阳<span class="ver">v1.30</span></h1>
  </div>
  <button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.5);font-size:12px" onclick="showHelp()">使用说明</button>
</div>
<div class="container">
  <div id="cacheBar" class="cache-bar hidden">
    <span>💾 检测到上次缓存数据</span>
    <button class="cb-btn" onclick="loadCache()">点击恢复</button>
    <button class="cb-btn" onclick="clearCache()" style="color:var(--danger)">清除缓存</button>
  </div>
  <div class="card" id="uploadCard">
    <div class="card-title"><span>📂</span> 导入成绩数据</div>
    <div class="controls" style="margin-bottom:10px">
      <button class="btn btn-outline" onclick="downloadTemplate()">📋 下载导入模板</button>
      <button class="btn btn-outline" onclick="showTemplateConfig()">⚙️ 模板定制</button>
    </div>
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📊</div>
      <p>点击或拖拽Excel文件到此处</p>
      <p class="hl">支持 .xlsx / .xls 格式</p>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this)">
    <div id="fileInfoBox" class="hidden">
      <div class="file-info">
        <span style="font-size:20px">📄</span>
        <div><div class="fn" id="fileName"></div><div class="fs" id="fileSize"></div></div>
        <button class="rm" onclick="removeFile()" title="移除文件">✕</button>
      </div>
    </div>
  </div>
  <div class="card hidden" id="configCard">
    <div class="card-title"><span>⚙️</span> 核算参数配置</div>
    <div class="cfg-sec"><h4>考试类别（自动从导入文件识别，可手动修改）</h4><div class="cfg-row"><label>考试名称：</label><input type="text" id="examTitle" value="" placeholder="导入文件后自动识别" style="width:320px"></div></div>
    <div class="cfg-sec"><h4>积分比例设置（满分100分）</h4><div class="cfg-row"><label>人均积分占比：</label><input type="number" id="ratioAvg" value="50" min="0" max="100" step="1"> 分<label>A档积分占比：</label><input type="number" id="ratioA" value="20" min="0" max="100" step="1"> 分<label>B档积分占比：</label><input type="number" id="ratioB" value="30" min="0" max="100" step="1"> 分</div></div>
    <div class="cfg-sec"><h4>档位比例设置</h4><div class="cfg-row"><label>A档比例：</label><input type="number" id="percentA" value="25" min="0" max="100" step="1"> %<label>B档比例：</label><input type="number" id="percentB" value="60" min="0" max="100" step="1"> %</div></div>
    <div class="cfg-sec"><h4>奖励比例设置</h4><div class="cfg-row"><label>教师奖励：</label><input type="number" id="rewardTeacher" value="30" min="0" max="100" step="1"> %<label>学生奖励：</label><input type="number" id="rewardStudent" value="20" min="0" max="100" step="1"> %</div></div>
  </div>
  <div class="card hidden" id="actionCard">
    <div class="controls">
      <button class="btn btn-primary" onclick="calculateAll()" id="calcBtn">🧮 开始核算</button>
      <button class="btn btn-success" onclick="exportExcel()" id="exportBtn" disabled>📥 导出完整Excel</button>
      <button class="btn btn-warning" onclick="exportSingleSubject()" id="exportSingleBtn" disabled>📤 导出当前科目</button>
    </div>
  </div>
  <div class="card hidden" id="resultCard">
    <div class="card-title"><span>📈</span> 核算结果</div>
    <div class="tabs" id="subjectTabs"></div>
    <div id="statsArea"></div>
    <div class="table-wrap" id="tableArea"></div>
  </div>
</div>

<div id="modalBg" class="modal-bg hidden" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalContent"></div></div>
